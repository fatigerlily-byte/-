<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>おじさんウォッチ</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', sans-serif;
      background: #000;
      color: #fff;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      user-select: none;
    }

    /* ── Stats Bar ── */
    #stats-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 10px 16px;
      background: linear-gradient(to bottom, rgba(0,0,0,.7) 0%, transparent 100%);
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
    }
    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .stat-label { opacity: .6; font-size: 10px; }
    .stat-value { font-size: 14px; }
    #addiction-bar-wrapper {
      position: fixed;
      top: 54px; left: 16px; right: 16px;
      z-index: 200;
      pointer-events: none;
    }
    #addiction-bar-bg {
      height: 4px;
      background: rgba(255,255,255,.2);
      border-radius: 2px;
      overflow: hidden;
    }
    #addiction-bar-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      background: linear-gradient(90deg, #00e676, #ffeb3b, #ff5252);
      transition: width .4s ease, background .4s;
    }

    /* ── Video Feed ── */
    #feed-container {
      width: 100%;
      height: 100dvh;
      position: relative;
      overflow: hidden;
    }

    .video-card {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 80px 16px 80px;
      will-change: transform;
      transition: transform .3s cubic-bezier(.25,.46,.45,.94);
    }
    .video-card .card-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }
    .video-card .card-content {
      position: relative;
      z-index: 1;
    }
    .video-username {
      font-size: 15px;
      font-weight: 700;
      margin-bottom: 6px;
      text-shadow: 0 1px 4px rgba(0,0,0,.8);
    }
    .video-caption {
      font-size: 13px;
      line-height: 1.5;
      text-shadow: 0 1px 3px rgba(0,0,0,.8);
      max-width: 75%;
    }
    .video-tags { color: #69c0ff; }

    /* Right-side action buttons */
    .video-actions {
      position: absolute;
      right: 12px;
      bottom: 100px;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 11px;
    }
    .action-icon {
      width: 44px; height: 44px;
      background: rgba(255,255,255,.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      backdrop-filter: blur(4px);
    }

    /* Fake progress bar at bottom */
    .video-progress {
      position: absolute;
      bottom: 60px; left: 16px; right: 16px;
      height: 2px;
      background: rgba(255,255,255,.3);
      border-radius: 1px;
      z-index: 1;
    }
    .video-progress-fill {
      height: 100%;
      background: #fff;
      border-radius: 1px;
      animation: progress-anim 8s linear infinite;
    }
    @keyframes progress-anim {
      from { width: 0% }
      to   { width: 100% }
    }

    /* ── Ojisan Overlay ── */
    #ojisan-wrap {
      position: fixed;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 500;
      pointer-events: none;
      overflow: hidden;
      width: 0px;
      height: 360px;
      transition: width .6s cubic-bezier(.34,1.56,.64,1), height .6s ease;
      filter: drop-shadow(4px 0 12px rgba(0,0,0,.5));
    }
    #ojisan-svg {
      position: absolute;
      right: 0;
      top: 0;
      width: 360px;
      height: 360px;
    }

    /* Speech bubble */
    #speech-bubble {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-200%);
      z-index: 600;
      background: #fff;
      color: #333;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      max-width: 200px;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
      opacity: 0;
      transition: opacity .4s, transform .4s;
      pointer-events: none;
    }
    #speech-bubble.show {
      opacity: 1;
      transform: translateY(-50%);
    }
    #speech-bubble::before {
      content: '';
      position: absolute;
      left: -8px;
      top: 50%;
      transform: translateY(-50%);
      border: 8px solid transparent;
      border-right-color: #fff;
      border-left: 0;
    }

    /* Screen-time warning overlay */
    #warning-overlay {
      position: fixed;
      inset: 0;
      z-index: 800;
      background: rgba(255,82,82,.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 32px;
      opacity: 0;
      pointer-events: none;
      transition: opacity .5s;
      text-align: center;
    }
    #warning-overlay.show {
      opacity: 1;
      pointer-events: all;
    }
    #warning-overlay h2 { font-size: 28px; }
    #warning-overlay p  { font-size: 15px; opacity: .9; line-height: 1.6; }
    #dismiss-btn {
      margin-top: 8px;
      padding: 12px 28px;
      background: #fff;
      color: #ff5252;
      border: none;
      border-radius: 24px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Scroll hint */
    #scroll-hint {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 300;
      font-size: 12px;
      opacity: .5;
      animation: bounce 1.5s ease infinite;
      pointer-events: none;
    }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(-6px); }
    }
  </style>
</head>
<body>

<!-- Ojisan -->
<div id="ojisan-wrap">

<!-- Speech Bubble -->
<div id="speech-bubble"></div>

<!-- Warning Overlay -->
<div id="warning-overlay">
  <div style="font-size:60px">😰</div>

  <button id="dismiss-btn">わかった、少し休む</button>

<div id="scroll-hint">↑ スワイプして次の動画へ ↑</div>

<script>
// ── Video data ──────────────────────────────────────────────
const VIDEOS = [
  { bg: ['#1a1a2e','#16213e'], emoji:'🕺', user:'@dance_master_jp',  caption:'最新ダンスチャレンジ！みんなで踊ろう', tags:'#踊ってみた #チャレンジ #TikTok', likes:'24.3万', comments:'1.2万', music:'♪ Original Sound - dance_master' },
  { bg: ['#0f3460','#533483'], emoji:'🍜', user:'@cooking_girl_tokyo', caption:'5分でできる本格ラーメン🍜レシピ公開！', tags:'#料理 #時短 #ラーメン', likes:'18.7万', comments:'8.9千', music:'♪ Lo-fi Cooking BGM' },
  { bg: ['#2d1b69','#11998e'], emoji:'🐱', user:'@neko_life_official', caption:'今日も丸くなってる...可愛すぎ問題😂', tags:'#猫 #ねこ #かわいい', likes:'52.1万', comments:'3.4万', music:'♪ Cat Vibes - neko_life' },
  { bg: ['#1e3c72','#2a5298'], emoji:'🎮', user:'@pro_gamer_yuta',   caption:'このシーン何回見ても鳥肌！神プレイ集', tags:'#ゲーム #プロゲーマー #神プレイ', likes:'31.5万', comments:'2.1万', music:'♪ Epic Gaming - yuta' },
  { bg: ['#4a1942','#c64f7a'], emoji:'💄', user:'@beauty_rena_official', caption:'5分メイクで垢抜け！神コスメ紹介', tags:'#メイク #コスメ #垢抜け', likes:'40.2万', comments:'5.6千', music:'♪ Beauty BGM - rena' },
  { bg: ['#134e5e','#71b280'], emoji:'🏋️', user:'@fitness_takuya', caption:'毎日10分でここまで変わった！3ヶ月記録', tags:'#筋トレ #ダイエット #ビフォーアフター', likes:'27.8万', comments:'1.8万', music:'♪ Workout Beat - takuya' },
  { bg: ['#373b44','#4286f4'], emoji:'🌆', user:'@travel_japan_hiro', caption:'深夜の渋谷がエモすぎる...東京の夜景', tags:'#渋谷 #東京 #夜景', likes:'15.3万', comments:'7.2千', music:'♪ Night City - hiro' },
  { bg: ['#ee0979','#ff6a00'], emoji:'😂', user:'@comedy_shorts_ken', caption:'このオチ予想できた人いる？笑', tags:'#コメディ #爆笑 #ショート', likes:'61.4万', comments:'8.8万', music:'♪ Funny BGM - ken' },
  { bg: ['#093028','#237a57'], emoji:'🎸', user:'@music_gen_guitar', caption:'路上ライブで100人立ち止まった瞬間', tags:'#ギター #路上ライブ #感動', likes:'44.7万', comments:'3.3万', music:'♪ Original - gen_guitar' },
  { bg: ['#360033','#0b8793'], emoji:'📚', user:'@study_method_ai', caption:'東大生が教える「忘れない」暗記術3選', tags:'#勉強 #受験 #東大', likes:'22.1万', comments:'1.1万', music:'♪ Study BGM - ai' },
];

// ── State ────────────────────────────────────────────────────
const state = {
  currentIdx: 0,
  sessionSec: 0,
  swipeCount: 0,
  lastSwipeSpeed: 0,       // px/s
  swipeScore: 0,           // grows with swipes, decays
  addictionPct: 0,         // 0–100
  lastSwipeAt: Date.now(),
  speechShownAt: -999,
  warningShownAt: -999,
};

const MESSAGES = [
  { pct: 18, msg: 'そんなに見てて大丈夫？' },
  { pct: 35, msg: 'もう少し休んだら？😟' },
  { pct: 52, msg: 'スマホ置いてみなよ…' },
  { pct: 68, msg: '青春が溶けていくよ！⏳' },
  { pct: 82, msg: '頼む…休んでくれ…😭' },
  { pct: 95, msg: 'もう限界だ！助けてくれ！' },
];
const WARNINGS = [
  { pct: 40, msg: '最近スクロール速度が上がっています。\n脳が刺激に慣れてきているサインです。\n5分だけスマホを置いてみませんか？' },
  { pct: 75, msg: '視聴時間がかなり長くなっています。\n動画を見ることで得られる幸福感は短命です。\n現実の体験に時間を使いましょう。' },
  { pct: 95, msg: 'おじさんは限界です。\nあなたの時間はとても大切です。\n今すぐアプリを閉じて外に出てください！' },
];

let shownWarnings = new Set();

// ── Build video cards ────────────────────────────────────────
const feed = document.getElementById('feed-container');

function buildCard(v, idx) {
  const card = document.createElement('div');
  card.className = 'video-card';
  card.dataset.idx = idx;
  card.style.transform = `translateY(${idx === 0 ? '0' : '100'}%)`;
  card.innerHTML = `
    <div class="card-bg" style="background:linear-gradient(160deg,${v.bg[0]},${v.bg[1]})"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:120px;opacity:.12;z-index:0">${v.emoji}</div>
    <div class="video-actions">
      <div class="action-btn"><div class="action-icon">❤️</div><span>${v.likes}</span></div>
      <div class="action-btn"><div class="action-icon">💬</div><span>${v.comments}</span></div>
      <div class="action-btn"><div class="action-icon">↗️</div><span>シェア</span></div>
      <div class="action-btn"><div class="action-icon">⚙️</div><span></span></div>
    </div>
    <div class="card-content">
      <div class="video-username">${v.user}</div>
      <div class="video-caption">${v.caption}<br><span class="video-tags">${v.tags}</span></div>
      <div style="margin-top:8px;font-size:12px;opacity:.7">🎵 ${v.music}</div>
    </div>
    <div class="video-progress"><div class="video-progress-fill"></div></div>
  `;
  feed.appendChild(card);
  return card;
}

VIDEOS.forEach((v, i) => buildCard(v, i));

function getCard(idx) {
  return feed.querySelector(`[data-idx="${((idx % VIDEOS.length) + VIDEOS.length) % VIDEOS.length}"]`);
}

// ── Swipe / Drag Logic ───────────────────────────────────────
let dragStart = null;
let dragCurrent = null;
let dragging = false;

function getY(e) {
  return e.touches ? e.touches[0].clientY : e.clientY;
}
function getT() { return Date.now(); }

feed.addEventListener('touchstart', onDragStart, { passive: false });
feed.addEventListener('mousedown',  onDragStart);
window.addEventListener('touchmove',  onDragMove, { passive: false });
window.addEventListener('mousemove',  onDragMove);
window.addEventListener('touchend',  onDragEnd);
window.addEventListener('mouseup',   onDragEnd);

function onDragStart(e) {
  dragStart = { y: getY(e), t: getT() };
  dragCurrent = { y: getY(e), t: getT() };
  dragging = true;
}

function onDragMove(e) {
  if (!dragging) return;
  e.preventDefault();
  dragCurrent = { y: getY(e), t: getT() };

  const dy = dragCurrent.y - dragStart.y;
  const cur = getCard(state.currentIdx);
  if (cur) cur.style.transition = 'none';
  if (cur) cur.style.transform = `translateY(${dy}px)`;

  // Peek next/prev
  if (dy < 0) {
    const next = getCard(state.currentIdx + 1);
    if (next) { next.style.transition = 'none'; next.style.transform = `translateY(calc(100% + ${dy}px))`; }
  } else {
    const prev = getCard(state.currentIdx - 1);
    if (prev) { prev.style.transition = 'none'; prev.style.transform = `translateY(calc(-100% + ${dy}px))`; }
  }
}

function onDragEnd() {
  if (!dragging || !dragStart || !dragCurrent) return;
  dragging = false;

  const dy = dragCurrent.y - dragStart.y;
  const dt = (dragCurrent.t - dragStart.t) || 1;
  const speed = Math.abs(dy) / dt * 1000; // px/s

  const threshold = 60;
  if (Math.abs(dy) > threshold) {
    const dir = dy < 0 ? 1 : -1;
    advanceFeed(dir, speed);
  } else {
    // Snap back
    const cur = getCard(state.currentIdx);
    if (cur) { cur.style.transition = ''; cur.style.transform = 'translateY(0)'; }
    const next = getCard(state.currentIdx + 1);
    if (next) { next.style.transition = ''; next.style.transform = 'translateY(100%)'; }
    const prev = getCard(state.currentIdx - 1);
    if (prev) { prev.style.transition = ''; prev.style.transform = 'translateY(-100%)'; }
  }

  dragStart = dragCurrent = null;
}

function advanceFeed(dir, speed) {
  const newIdx = state.currentIdx + dir;
  const cur  = getCard(state.currentIdx);
  const next = getCard(newIdx);

  if (cur)  { cur.style.transition  = ''; cur.style.transform  = `translateY(${dir > 0 ? '-100%' : '100%'})`; }
  if (next) { next.style.transition = ''; next.style.transform = 'translateY(0)'; }

  // Prepare card after
  const after = getCard(newIdx + dir);
  if (after) { after.style.transition = 'none'; after.style.transform = `translateY(${dir > 0 ? '100%' : '-100%'})`; }

  state.currentIdx = newIdx;
  state.swipeCount++;
  state.lastSwipeSpeed = speed;
  state.lastSwipeAt = Date.now();

  // Score from swipe
  const normalized = Math.min(speed / 3000, 1); // cap at 3000px/s
  state.swipeScore = Math.min(state.swipeScore + normalized * 12 + 2, 100);

  document.getElementById('scroll-hint').style.display = 'none';
  updateSpeedDisplay(speed);
}

function updateSpeedDisplay(speed) {
  const el = document.getElementById('speed-display');
  el.textContent = Math.round(speed) + ' px/s';
  el.style.color = speed > 1500 ? '#ff5252' : speed > 800 ? '#ffeb3b' : '#fff';
}

// ── Game Loop ────────────────────────────────────────────────
setInterval(tick, 1000);

function tick() {
  state.sessionSec++;

  // Time-based score (slow accumulation)
  const timeBonus = Math.min(state.sessionSec / 600, 1) * 0.15; // caps at 15% from time
  state.swipeScore = Math.min(state.swipeScore + timeBonus, 100);

  // Decay: if no swipe for 4s, slowly decay
  const secSinceSwipe = (Date.now() - state.lastSwipeAt) / 1000;
  if (secSinceSwipe > 4) {
    const decayRate = 0.4 + (secSinceSwipe - 4) * 0.1;
    state.swipeScore = Math.max(0, state.swipeScore - decayRate);
  }

  state.addictionPct = Math.round(state.swipeScore);
  updateUI();
  updateOjisan();
  checkSpeech();
  checkWarning();
}

// ── UI Updates ───────────────────────────────────────────────
function updateUI() {
  const m = Math.floor(state.sessionSec / 60);
  const s = state.sessionSec % 60;
  document.getElementById('time-display').textContent = `${m}:${String(s).padStart(2,'0')}`;
  document.getElementById('swipe-display').textContent = state.swipeCount;
  document.getElementById('addiction-display').textContent = state.addictionPct + '%';

  const fill = document.getElementById('addiction-bar-fill');
  fill.style.width = state.addictionPct + '%';
}

// ── Ojisan ───────────────────────────────────────────────────
const ojisanWrap = document.getElementById('ojisan-wrap');
const MAX_OJ_SIZE = 360;

function updateOjisan() {
  const p = state.addictionPct / 100;
  const size = p * MAX_OJ_SIZE;
  ojisanWrap.style.width  = size + 'px';
  ojisanWrap.style.height = size + 'px';

  // Vertical jitter when high addiction
  if (p > 0.8) {
    const jitter = Math.sin(Date.now() / 200) * 4;
    ojisanWrap.style.marginTop = jitter + 'px';
  } else {
    ojisanWrap.style.marginTop = '0';
  }
}

// ── Speech Bubble ────────────────────────────────────────────
const bubble = document.getElementById('speech-bubble');
let bubbleTimeout = null;

function checkSpeech() {
  const pct = state.addictionPct;
  for (let i = MESSAGES.length - 1; i >= 0; i--) {
    if (pct >= MESSAGES[i].pct) {
      const msg = MESSAGES[i].msg;
      if (bubble.textContent !== msg) showBubble(msg);
      return;
    }
  }
  hideBubble();
}

function showBubble(msg) {
  bubble.textContent = msg;
  // Position next to ojisan face
  const ojSize = (state.addictionPct / 100) * MAX_OJ_SIZE;
  bubble.style.left = (ojSize + 20) + 'px';
  bubble.classList.add('show');
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(hideBubble, 3500);
}

function hideBubble() {
  bubble.classList.remove('show');
}

// ── Warning Overlay ──────────────────────────────────────────
document.getElementById('dismiss-btn').addEventListener('click', () => {
  document.getElementById('warning-overlay').classList.remove('show');
});

function checkWarning() {
  const pct = state.addictionPct;
  for (let i = WARNINGS.length - 1; i >= 0; i--) {
    if (pct >= WARNINGS[i].pct && !shownWarnings.has(i)) {
      shownWarnings.add(i);
      showWarning(WARNINGS[i].msg);
      return;
    }
  }
}

function showWarning(msg) {
  document.getElementById('warning-msg').textContent = msg;
  document.getElementById('warning-overlay').classList.add('show');
}

// ── Init ─────────────────────────────────────────────────────
updateUI();
updateOjisan();
</script>
</body>
</html>
